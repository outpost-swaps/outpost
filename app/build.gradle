plugins {
    // Apply the java-library plugin for API and implementation separation.
    id 'java-library'
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
//    id 'org.springframework.boot' version '3.1.4'
    // Removed Whirlpool. TODO: Re-add with new client
    // See ServiceWallet.java for mixing integration hooks.
}

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
    maven { url "https://dl.cloudsmith.io/public/libp2p/jvm-libp2p/maven/" }
    maven { url "https://artifacts.consensys.net/public/maven/maven/" }
    maven { url "https://jitpack.io" }
}

dependencies {
    // Use JUnit test framework.
    testImplementation 'junit:junit:4.13.2'

    implementation group: 'org.json', name: 'json', version: '20231013'

    // Vendored Samourai stack (wallet, bitcoinj, whirlpool client/protocol) — see
    // swaps-handoff/tasks/wp-reintegration.md Decision 1. Replaces the old
    // io.samourai.code.wallet:extlibj / bitcoinj / xmanager-protocol JitPack coordinates,
    // which 403 on JitPack and were never actually resolvable from a clean checkout.
    implementation(project(':darkjar'))
    // darkjar declares these as `implementation`, so they don't leak to app's compile
    // classpath even though app code (and darkjar's own public method signatures that
    // app implements/extends) touches them directly. Same versions as libs/darkjar/build.gradle.
    implementation 'com.google.guava:guava:33.0.0-jre'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.77'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.13.2'
    implementation 'io.reactivex.rxjava2:rxjava:2.2.15'
    implementation 'net.sourceforge.streamsupport:streamsupport:1.7.0'
    implementation 'com.google.code.findbugs:jsr305:3.0.2'
    implementation 'io.github.mkpaz:atlantafx-base:2.0.1'
    // LifeHash: the small picture Ashigaru Desktop / Sparrow show for a wallet fingerprint, so an imported
    // wallet can be recognised at a glance. Pure local code (no network).
    implementation 'com.sparrowwallet:toucan:0.9.0'

    implementation 'com.github.pokkst:netlayer:cc5bef37' // TODO
//    implementation 'org.springframework.boot:spring-boot-starter-web:2.6.2' TODO: Re-add WP
//    annotationProcessor "org.springframework.boot:spring-boot-configuration-processor:2.6.2"
    // qr code
    implementation 'com.google.zxing:core:3.5.2'
    implementation 'com.google.zxing:javase:3.5.2'

    implementation 'org.controlsfx:controlsfx:11.1.2'
    implementation "de.jensd:fontawesomefx-fontawesome:4.7.0-9.1.2"
    implementation 'org.fxmisc.richtext:richtextfx:0.11.7'
}

javafx {
    version = "25.0.5"
    modules = [ 'javafx.controls', 'javafx.fxml', 'javafx.web', 'javafx.swing', 'javafx.base', 'javafx.graphics', 'javafx.media' ]
}

//tasks.named("bootJar") { TODO: Re-add WP
//  duplicatesStrategy = DuplicatesStrategy.EXCLUDE
//  exclude("classpath.index")
//}

application {
    mainClass = "swap.gui.Main"
}

// macOS shows the Java default in the dock when the app is started with `gradlew run` (start.sh).
// A packaged app takes its icon from the app bundle instead.
tasks.named('run') {
    if (org.gradle.internal.os.OperatingSystem.current().isMacOsX()) {
        jvmArgs "-Xdock:icon=${projectDir}/src/main/resources/images/outpost-icon.png"
    }
}
