[package]
name = "electrum-pool"
version = "0.1.0"
authors = ["eigenwallet Team <help@unstoppableswap.net>"]
edition = "2024"

[dependencies]
bdk_electrum = { version = "0.23.0", default-features = false, features = ["use-rustls-ring"] }
bitcoin = { version = "0.32", features = ["serde"] }
futures = "0.3"
once_cell = "1.19"
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros", "sync"] }
tracing = "0.1"
